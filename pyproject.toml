[build-system]
requires = ["setuptools==80.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waveform-exploration"
version = "0.1.0"
description = "Configurable delay-Doppler waveform exploration and distinct residual-CFO evaluation"
requires-python = ">=3.10"
dependencies = ["torch==2.7.0", "numpy==2.2.6", "matplotlib==3.10.3", "pandas==2.2.3"]

[project.scripts]
waveforms = "waveforms.cli:main"

[tool.setuptools.packages.find]
include = ["waveforms*"]

[tool.pytest.ini_options]
testpaths = ["support/tests"]
markers = ["artifacts: needs the explicitly provisioned local evidence bundle"]

[tool.setuptools.package-data]
waveforms = ["data/manifest.json", "data/dd_*.npz", "data/dd_replay.csv", "data/cfo_stage1.pt"]
